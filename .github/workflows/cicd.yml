name: Virtual Job Simulation CI/CD

on:
  push:
    branches:
      - main
      - week4-cicd
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Static Code Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install flake8

      - name: Run Flake8
        run: |
          flake8 backend --exclude=__pycache__

  test:
    name: Automated Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Run tests
        run: |
          pytest -v

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build backend image
        run: |
          docker build -t virtual-job-backend ./backend

      - name: Build frontend image
        run: |
          docker build -t virtual-job-frontend ./frontend

  deploy:
    name: Deploy to Kubernetes Test Environment
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Deploy Kubernetes manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/secret.yaml
          kubectl apply -f k8s/database.yaml
          kubectl apply -f k8s/backend-deployment.yaml
          kubectl apply -f k8s/backend-service.yaml
          kubectl apply -f k8s/frontend-deployment.yaml
          kubectl apply -f k8s/frontend-service.yaml
          kubectl apply -f k8s/ingress.yaml
          kubectl apply -f k8s/network-policy.yaml

      - name: Verify deployment
        run: |
          kubectl get pods -n virtual-job-platform
          kubectl get services -n virtual-job-platform

      - name: Rollback on deployment failure
        if: failure()
        run: |
          kubectl rollout undo deployment/virtual-job-backend -n virtual-job-platform || true
          kubectl rollout undo deployment/virtual-job-frontend -n virtual-job-platform || true
