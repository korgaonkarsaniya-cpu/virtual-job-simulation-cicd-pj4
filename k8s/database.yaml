apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: platform-data
  namespace: virtual-job-platform
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-database
  namespace: virtual-job-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-database
  template:
    metadata:
      labels:
        app: demo-database
    spec:
      containers:
        - name: database
          image: busybox:1.36
          command: ["sh", "-c", "while true; do date >> /data/health.log; sleep 60; done"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: platform-data
