apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: virtual-job-ingress
  namespace: virtual-job-platform
spec:
  rules:
    - host: virtual-job.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
