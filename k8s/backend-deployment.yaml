apiVersion: apps/v1
kind: Deployment
metadata:
  name: virtual-job-backend
  namespace: virtual-job-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: virtual-job-backend
  template:
    metadata:
      labels:
        app: virtual-job-backend
    spec:
      containers:
        - name: backend
          image: virtual-job-backend:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: platform-config
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
